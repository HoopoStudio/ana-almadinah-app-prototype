# Nginx server block for queue.ana-almadinahart.com
# Install:  sudo cp deploy/hetzner/nginx-queue.conf /etc/nginx/sites-available/queue
#           sudo ln -s /etc/nginx/sites-available/queue /etc/nginx/sites-enabled/queue
#           sudo nginx -t && sudo systemctl reload nginx
#           sudo certbot --nginx -d queue.ana-almadinahart.com   # adds HTTPS, edits this file
server {
    listen 80;
    listen [::]:80;
    server_name queue.ana-almadinahart.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Live updates (Server-Sent Events) must not be buffered.
    location /api/events {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }
}
